## Rule schema version (used by humans; runtime currently expects v1)
version: 1

## Cloud provider these rules apply to
provider: aws

# NOTE: This file is the source of truth for regex/exact-based risk classification.
# The full per-permission categorized YAML lists (aws_permissions_cat.yaml, etc) are kept for reference
# but should not be used by runtime code.

## =====================
## CRITICAL RULES
## =====================

## Exact action names that must always be classified as `critical`.
## Matching is case-insensitive in the classifier.
critical_exact:
  - backup:PutBackupVaultAccessPolicy
  - codeartifact:GetAuthorizationToken
  - ec2:AssociateIamInstanceProfile
  - ec2:GetPasswordData
  - ec2:ReplaceIamInstanceProfileAssociation
  - ecr-public:GetAuthorizationToken
  - ecr:GetAuthorizationToken
  - ecs:ExecuteCommand
  - events:RetrieveConnectionCredentials
  - iam:PassRole
  - iot:OpenTunnel
  - kms:CreateGrant
  - kms:Decrypt
  - kms:PutKeyPolicy
  - lambda:UpdateFunctionCode
  - lambda:UpdateFunctionConfiguration
  - s3:PutBucketPolicy
  - s3:PutAccessPointPolicy
  # S3 boundary-changing ACL operations (treat as critical via exact match)
  - s3:PutBucketAcl
  - s3:PutObjectAcl
  - s3:PutObjectVersionAcl
  - sagemaker:CreatePresignedNotebookInstanceUrl
  - secretsmanager:GetSecretValue
  - ssm:GetParameter
  - ssm:GetParameters
  - ssm:GetParametersByPath
  - ssm:ResumeSession
  - ssm:SendCommand
  - ssm:StartSession
  - sts:GetDelegatedAccessToken
  - sts:GetServiceBearerToken

## =====================
## EVIDENCE-BACKED DOWNGRADES
## =====================

## Exact actions that are only medium in isolation. Their documented companion
## permissions can still form high-impact combinations.
medium_override_exact:
  # The caller also needs iam:PassRole, a capable restore role, and access to
  # the restored target before this becomes a sensitive-data path.
  - backup:StartRestoreJob
  # These become a critical launch-role escalation only as a pair, and only
  # when the caller controls a product artifact associated with a privileged
  # launch constraint. Neither action is independently a privilege grant.
  - servicecatalog:CreateProvisioningArtifact
  - servicecatalog:ProvisionProduct
  # A recipe must track a wildcard version of the attacker-writable component,
  # and its existing pipeline instance profile must have useful privileges.
  # The pair is critical; neither action provides that profile by itself.
  - imagebuilder:CreateComponent
  - imagebuilder:StartImagePipelineExecution
  # No supported caller-facing API exposes connection credentials directly.
  - events:RetrieveConnectionCredentials

